{% extends "layout.html" %}
{% block content %}
<h2>Run History</h2>
<form method="get" action="/runs" class="inline-form">
  <label>Limit</label>
  <input type="number" name="limit" min="1" max="500" value="{{ limit }}">
  <button type="submit">Refresh</button>
</form>
<table>
  <thead>
    <tr><th>run_id</th><th>component</th><th>status</th><th>started_at</th><th>finished_at</th><th>error_message</th></tr>
  </thead>
  <tbody>
  {% for row in runs %}
    <tr>
      <td>{{ row.run_id }}</td>
      <td>{{ row.component }}</td>
      <td>{{ row.status }}</td>
      <td>{{ row.started_at_utc }}</td>
      <td>{{ row.finished_at_utc }}</td>
      <td>{{ row.error_message }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
