{% extends "layout.html" %}
{% block content %}
<h2>Config Query Rules</h2>
{% if message %}<p class="msg">{{ message }}</p>{% endif %}
<form method="post" action="/config/query-rules">
  <textarea name="content" rows="30">{{ content }}</textarea>
  <button type="submit">Save (YAML validate)</button>
</form>
{% endblock %}
