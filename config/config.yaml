project:

  name: wb_unified_parser_v1

  source_system: wildberries

  timezone: Europe/Moscow



paths:

  data_raw: data/raw

  data_staging: data/staging

  data_marts: data/marts

  logs: data/logs

  exports: exports

  state_sqlite: state/sqlite/wb_pipeline_state.sqlite

  checkpoints_dir: state/checkpoints



runtime:

  retry_max_attempts: 5

  retry_base_delay_seconds: 1.0

  retry_max_delay_seconds: 20.0

  http_timeout_seconds: 45

  dry_run: false

  debug: false

  locking_enabled: true

  lock_stale_seconds: 21600



validation:

  max_error_ratio:

    suggest: 0.95

    serp: 0.05

    sellers: 0.95



retention:

  enabled: false

  delete_empty_dirs: true

  days:

    logs: 30

    raw: 60

    staging: 60

    marts: 180

    exports: 30

    run_reports: 90



suggest:

  prefixes_file: config/prefixes.txt

  alphabet_mode: ru30

  throttle_ms: 900

  type_delay_ms: 50

  headless: true

  browser_channel: chrome

  browser_profile_dir: state/browser/wb_profile

  max_typed_queries: 0

  full_refresh_checkpoints: false

  force_full_refresh: false

  empty_checkpoint_policy: mark_done



filter:

  rules_file: config/query_rules.yaml

  wordstat_csv: config/wordstat.csv

  wordstat_csv_files: []

  wordstat_csv_glob: data/raw/wordstat/*.csv

  input_files:

    suggest_staging_csv: ""

  output_files:

    candidates_raw_csv: filter_candidates_raw.csv

    debug_scores_csv: debug_scores.csv

    top_queries_csv: top_queries.csv

    queries_txt: queries.txt



serp:

  input_files:

    queries_txt: exports/queries.txt

    top_queries_csv: data/marts/filter/latest/top_queries.csv

  pages_per_query: 10

  page_size: 100

  wb_cookie_file_env: WB_COOKIE_FILE
  cookie_required_env: PARSER_WB_COOKIE_REQUIRED

  wb_cookie_file: config/wb_cookie.txt

  proxy_url_env: PARSER_WB_PROXY_URL

  proxy_url: ""

  request_headers_file_env: PARSER_WB_REQUEST_HEADERS_FILE

  base_url: https://www.wildberries.ru/__internal/u-search/exactmatch/ru/common/v18/search
  fallback_base_urls:
    - https://search.wb.ru/exactmatch/ru/male/v18/search
  smoke_min_successes: 2

  request_params:

    ab_testid: model_reranking_all_logistic_boost

    appType: "1"

    curr: rub

    dest: "-1255987"

    hide_vflags: "4294967296"

    inheritFilters: "false"

    lang: ru

    resultset: catalog

    sort: popular

    spp: "30"

    suppressSpellcheck: "false"

  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)

  referer_base: https://www.wildberries.ru/catalog/0/search.aspx?search=

  x_requested_with: XMLHttpRequest

  retry_http_statuses:

    - 429

    - 498

    - 500

    - 502

    - 503

    - 504

  rate_limit_http_statuses:

    - 429

    - 498

  retry_max_attempts: 4

  retry_base_delay_seconds: 8.0

  retry_max_delay_seconds: 60.0

  sleep_between_pages_ms: 4500

  error_sleep_ms: 8000

  rate_limit_sleep_ms: 45000

  error_ip_rotation_enabled: true

  error_ip_rotation_url_env: PARSER_WB_PROXY_ROTATE_URL

  error_ip_rotation_wait_seconds: 120

  error_ip_rotation_max_attempts: 1

  deferred_retry_enabled: true

  deferred_retry_sleep_seconds: 600

  abort_after_consecutive_rate_limits: 3

  payload_anomaly_cooldown_after_consecutive: 5

  payload_anomaly_cooldown_base_seconds: 600

  payload_anomaly_cooldown_increment_seconds: 600

  payload_anomaly_cooldown_max_seconds: 0

  payload_anomaly_keeper_smoke_enabled: true

  payload_anomaly_keeper_smoke_sample_count: 3

  payload_anomaly_keeper_smoke_page: 1

  sleep_between_queries_ms: 12000

  stop_on_empty_page: true

  raw_pages_subdir: pages

  output_files:

    raw_products_csv: products_raw.csv

    staging_products_csv: products_staging.csv

    mart_products_daily_csv: products_daily.csv

    raw_pages_index_csv: pages_raw_index.csv

    sellers_input_csv: products_for_sellers.csv



sellers:

  input_files:

    products_daily_csv: data/marts/serp/latest/products_daily.csv

  api_base_url: https://suppliers-shipment-2.wildberries.ru/api/v1/suppliers

  curr: RUB

  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)

  sleep_between_sellers_ms: 250

  full_refresh_checkpoints: false

  raw_responses_subdir: responses

  request_headers:

    accept: "*/*"

    accept-language: ru,en;q=0.9,en-US;q=0.8

    origin: https://www.wildberries.ru

    x-client-name: site

  output_files:

    raw_sellers_csv: sellers_raw.csv

    staging_sellers_csv: sellers_staging.csv

    mart_sellers_daily_csv: sellers_daily.csv

    bridge_csv: seller_query_product_bridge.csv



webui:

  host: 127.0.0.1

  port: 8080

  admin_username: admin

  admin_password_env: WEBUI_ADMIN_PASSWORD

  secret_key_env: WEBUI_SECRET_KEY

